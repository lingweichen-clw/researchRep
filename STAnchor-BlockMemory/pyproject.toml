[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stanchor-block-memory"
version = "0.1.0"
description = "Single-source spatiotemporal pretraining and block-memory retrieval"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "tables>=3.8",
  "torch>=2.1",
]

[project.optional-dependencies]
diagnostics = [
  "matplotlib>=3.7",
  "scikit-learn>=1.6",
  "umap-learn>=0.5.12",
]

[tool.setuptools.packages.find]
include = ["stanchor*"]
