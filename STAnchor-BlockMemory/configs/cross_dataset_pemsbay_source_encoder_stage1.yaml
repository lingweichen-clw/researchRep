data:
  raw_path: ../data/pemsBay_data/pems-bay.h5
  adjacency_path: ../data/pemsBay_data/adj_mx_bay.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0
model:
  input_channels: 1
  output_channels: 1
  patch_size: 12
  hidden_dim: 128
  retrieval_dim: 64
  num_heads: 4
  encoder_layers: 4
  ffn_multiplier: 2
  dropout: 0.1
  graph_bias: 1.0
  route_enabled: true
  route_dim: 16
  route_top_k: 6
  route_local_quota: 0
  route_prior_weight: 0.25
  route_temperature: 0.1
  route_gate_bias: -2.0
  adapter_bottleneck_dim: 96
pretrain:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  objective: masked_relation_single_view
  reconstruction_weight: 2.0
  time_mask_ratio: 0.25
  time_mask_block_size: 36
  space_mask_ratio: 0.25
  time_task_probability: 0.5
  retrieval_weight: 1.0
  retrieval_loss_mode: relation
  retrieval_temperature: 0.1
  relation_teacher_temperature: 0.1
  relation_student_temperature: 0.1
  relation_teacher_mode: offset_decay
  relation_distance_normalization: symmetric_geometric_mean
  profile_loss_weight: 0.0
  profile_scale_floor: 0.1
  hard_negative_weight: 2.0
  positive_quantile: 0.1
  context_quantile: 0.2
  negative_quantile: 0.8
bank:
  output_dir: artifacts/cross_dataset_stage1/pemsbay_source_bank
  memory_fraction: 0.7
  event_top_r: 96
  node_top_k: 12
  level_weight: 0.0
  level_temperature: 1.0
  search_temperature: 0.1
  key_dtype: float16
target:
  candidate_protocol: weekday_radius1_overlap
  batch_size: 32
runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: cross_dataset_stage1_pemsbay_source
