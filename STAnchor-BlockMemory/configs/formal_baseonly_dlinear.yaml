data:
  raw_path: ../data/METRLA_data/METR-LA.h5
  adjacency_path: ../data/METRLA_data/adj_mx.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1

target:
  downstream_mode: base_only
  training_protocol: staged_joint
  training_data_scope: full_train
  candidate_protocol: weekday_radius1_overlap
  batch_size: 32
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0
  optimizer_name: adam
  optimizer_eps: 1.0e-8
  scheduler_name: none
  confidence_weight: 0.0
  backbone_name: dlinear
  dlinear_moving_avg_kernel: 25
  dlinear_individual: false
  patience: 3
  early_stopping_enabled: true
  risk_weight: 0.0
  blend_weight: 0.0
  candidate_quality_weight: 0.0
  validation_loss_variant: forecast_only
  forecast_loss_space: normalized
  forecast_loss_name: mse

runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: convergence/formal_20260910_baseonly_dlinear_seed42
