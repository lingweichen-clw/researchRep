data:
  raw_path: ../data/METRLA_data/METR-LA.h5
  adjacency_path: ../data/METRLA_data/adj_mx.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1
  patch_size: 12
  hidden_dim: 80
  retrieval_dim: 48
  profile_dim: 0
  latent_dim: 0
  profile_weight: 0.0
  num_heads: 4
  encoder_layers: 3
  ffn_multiplier: 2
  dropout: 0.1
  graph_bias: 1.0
  route_enabled: true
  route_dim: 16
  route_top_k: 6
  route_local_quota: 0
  route_prior_weight: 0.25
  route_temperature: 0.1
  route_gate_bias: -2.0
  dynamics_adapter_mode: none
  dynamics_bottleneck_dim: 16
  dynamics_gate_bias: -2.0
  dynamics_gate_groups: 8

pretrain:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  objective: masked_relation_single_view
  reconstruction_weight: 2.0
  validation_interval: 1
  time_mask_ratio: 0.25
  time_mask_block_size: 36
  space_mask_ratio: 0.25
  time_task_probability: 0.5
  retrieval_weight: 1.0
  retrieval_loss_mode: hard_negative_offset_decay
  retrieval_temperature: 0.1
  relation_teacher_temperature: 0.1
  relation_student_temperature: 0.1
  relation_teacher_mode: offset_decay
  relation_distance_normalization: symmetric_geometric_mean
  future_increment_weight: 0.0
  rank_loss_weight: 0.0
  profile_loss_weight: 0.0
  profile_scale_floor: 0.1
  hard_negative_weight: 2.0
  positive_quantile: 0.1
  context_quantile: 0.2
  negative_quantile: 0.8
  patience: 10
  early_stopping_enabled: false
  progress_interval: 10

bank:
  output_dir: artifacts/case_bank_hn_offset_decay_v1_seed42
  memory_fraction: 0.7
  event_top_r: 32
  node_top_k: 5
  level_weight: 0.0
  level_temperature: 1.0
  search_temperature: 0.1
  key_dtype: float16

target:
  downstream_mode: learned_topk_offset_decay_horizon
  candidate_protocol: exact_calendar
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  confidence_hidden_dim: 32
  confidence_weight: 1.0
  confidence_level_temperature: 1.0
  help_margin: 0.0
  help_temperature: 0.1
  backbone_hidden_dim: 64
  patience: 10

runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: metrla_e5_tgge_single_view_hn_offset_decay_v1_seed42


