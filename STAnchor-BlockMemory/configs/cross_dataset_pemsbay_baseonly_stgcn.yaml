data:
  raw_path: ../data/pemsBay_data/pems-bay.h5
  adjacency_path: ../data/pemsBay_data/adj_mx_bay.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1

target:
  downstream_mode: base_only
  training_protocol: staged_joint
  training_data_scope: full_train
  candidate_protocol: weekday_radius1_overlap
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer_name: adam
  scheduler_name: step_lr
  scheduler_step_size: 10
  scheduler_gamma: 0.95
  confidence_weight: 0.0
  backbone_name: stgcn
  stgcn_temporal_kernel: 3
  stgcn_graph_kernel: 3
  stgcn_block_num: 2
  stgcn_hidden_channels: 64
  stgcn_bottleneck_channels: 16
  stgcn_output_hidden_channels: 128
  stgcn_dropout: 0.5
  early_stopping_enabled: false
  risk_weight: 0.0
  blend_weight: 0.0
  candidate_quality_weight: 0.0
  validation_loss_variant: forecast_only
  forecast_loss_space: physical

runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: cross_dataset_stage1/pemsbay_baseonly_stgcn_seed42
