data:
  raw_path: ../data/pemsBay_data/pems-bay.h5
  adjacency_path: ../data/pemsBay_data/adj_mx_bay.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1

target:
  downstream_mode: base_only
  training_protocol: staged_joint
  training_data_scope: full_train
  candidate_protocol: weekday_radius1_overlap
  batch_size: 64
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0
  optimizer_name: adam
  optimizer_eps: 0.001
  scheduler_name: multi_step_lr
  scheduler_milestones: [20, 30, 40, 50]
  scheduler_gamma: 0.1
  confidence_weight: 0.0
  backbone_name: dcrnn
  dcrnn_rnn_units: 64
  dcrnn_rnn_layers: 2
  dcrnn_max_diffusion_step: 2
  dcrnn_filter_type: dual_random_walk
  dcrnn_use_curriculum_learning: true
  dcrnn_cl_decay_steps: 2000
  dcrnn_use_time_in_day: true
  patience: 50
  early_stopping_enabled: true
  risk_weight: 0.0
  blend_weight: 0.0
  candidate_quality_weight: 0.0
  validation_loss_variant: forecast_only
  forecast_loss_space: physical
  forecast_loss_name: mae

runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: cross_dataset_pemsbay/pemsbay_baseonly_dcrnn_seed42
