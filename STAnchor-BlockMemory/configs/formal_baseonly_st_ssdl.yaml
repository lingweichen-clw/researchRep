data:
  raw_path: ../data/METRLA_data/METR-LA.h5
  adjacency_path: ../data/METRLA_data/adj_mx.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0

model:
  input_channels: 1
  output_channels: 1

target:
  downstream_mode: base_only
  training_protocol: staged_joint
  training_data_scope: full_train
  candidate_protocol: weekday_radius1_overlap
  batch_size: 128
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0
  optimizer_name: adam
  optimizer_eps: 0.001
  scheduler_name: multi_step_lr
  scheduler_milestones: [50, 70]
  scheduler_gamma: 0.1
  confidence_weight: 0.0
  backbone_name: st_ssdl
  st_ssdl_rnn_units: 128
  st_ssdl_rnn_layers: 1
  st_ssdl_cheb_k: 3
  st_ssdl_prototype_num: 20
  st_ssdl_prototype_dim: 64
  st_ssdl_tod_embed_dim: 20
  st_ssdl_node_embedding_dim: 25
  st_ssdl_input_embedding_dim: 3
  st_ssdl_adaptive_embedding_dim: 0
  st_ssdl_use_ste: true
  st_ssdl_use_curriculum_learning: true
  st_ssdl_cl_decay_steps: 2000
  st_ssdl_contrastive_weight: 0.01
  st_ssdl_deviation_weight: 1.0
  st_ssdl_triplet_margin: 0.5
  patience: 30
  early_stopping_enabled: true
  risk_weight: 0.0
  blend_weight: 0.0
  candidate_quality_weight: 0.0
  validation_loss_variant: forecast_only
  forecast_loss_space: physical
  forecast_loss_name: mae

runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: convergence/formal_20260910_baseonly_st_ssdl_seed42
