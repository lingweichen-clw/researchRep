data:
  raw_path: ../data/pemsBay_data/pems-bay.h5
  adjacency_path: ../data/pemsBay_data/adj_mx_bay.pkl
  context_length: 12
  retrieval_context_length: 288
  horizon: 12
  frequency_minutes: 5
  train_ratio: 0.7
  val_ratio: 0.1
  zero_is_missing: true
  num_workers: 0
model:
  input_channels: 1
  output_channels: 1
  patch_size: 12
  hidden_dim: 128
  retrieval_dim: 64
  num_heads: 4
  encoder_layers: 4
  ffn_multiplier: 2
  dropout: 0.1
  graph_bias: 1.0
  route_enabled: true
  route_dim: 16
  route_top_k: 6
  route_local_quota: 0
  route_prior_weight: 0.25
  route_temperature: 0.1
  route_gate_bias: -2.0
  adapter_bottleneck_dim: 96
pretrain:
  batch_size: 16
  retrieval_loss_mode: relation
  relation_teacher_temperature: 0.1
  relation_student_temperature: 0.1
  relation_teacher_mode: offset_decay
  relation_distance_normalization: symmetric_geometric_mean
  profile_loss_weight: 0.0
bank:
  output_dir: artifacts/cross_dataset_stage1/pemsbay_source_bank
  memory_fraction: 0.7
  event_top_r: 96
  node_top_k: 12
  level_weight: 0.0
  level_temperature: 1.0
  search_temperature: 0.1
  key_dtype: float16
target:
  downstream_mode: learned_topk_error_aware
  training_protocol: posthoc_frozen_base
  training_data_scope: full_train
  candidate_protocol: weekday_radius1_overlap
  batch_size: 32
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.0001
  optimizer_name: adam
  scheduler_name: step_lr
  scheduler_step_size: 10
  scheduler_gamma: 0.5
  confidence_weight: 0.0
  backbone_name: stgcn
  stgcn_temporal_kernel: 3
  stgcn_graph_kernel: 3
  stgcn_block_num: 2
  stgcn_hidden_channels: 64
  stgcn_bottleneck_channels: 16
  stgcn_output_hidden_channels: 128
  stgcn_dropout: 0.5
  patience: 20
  early_stopping_enabled: false
  risk_hidden_dim: 512
  fusion_feature_hidden_dim: 64
  horizon_aggregation_hidden_dim: 256
  risk_weight: 0.0
  blend_weight: 0.0
  candidate_quality_weight: 0.0
  validation_loss_variant: forecast_only
  forecast_loss_space: physical
  validation_correction_variant: base_as_candidate
  calibrator_arch: retrieval_aware_mha_router
  candidate_token_dim: 256
  calibrator_state_dim: 256
  candidate_attention_heads: 4
  candidate_trajectory_hidden_dim: 64
  routing_hidden_dim: 128
  mha_dropout: 0.05
  use_horizon_embedding: true
  base_logit_init_bias: 1.0
  frozen_path_cache: true
  calibrator_warmup_epochs: 0
  backbone_learning_rate_scale: 0.1
runtime:
  seed: 42
  device: cuda:0
  output_dir: artifacts
  run_name: cross_dataset_stage1/pemsbay_router_stgcn_seed42
